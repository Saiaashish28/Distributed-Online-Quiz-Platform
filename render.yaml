# Deployment walkthrough: see "Deployment" in README.md (GitHub -> Neon -> Render Blueprint).
# Render Blueprint: backend (Docker web service) + frontend (static site).
# PostgreSQL is expected on Neon or another managed provider; set DATABASE_URL in the dashboard.
services:
  - type: web
    name: quizsphere-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # postgres://user:pass@host/db?sslmode=require (converted to JDBC automatically)
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false # e.g. https://quizsphere.onrender.com
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: API_DOCS_ENABLED
        value: "false"

  - type: web
    name: quizsphere-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # e.g. https://quizsphere-api.onrender.com
      - key: VITE_WS_BASE_URL
        sync: false # e.g. wss://quizsphere-api.onrender.com
