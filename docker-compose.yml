# Local development database. Not used in production (use Neon / managed PostgreSQL).
services:
  postgres:
    image: postgres:17-alpine
    container_name: quizsphere-postgres
    environment:
      POSTGRES_DB: quizsphere
      POSTGRES_USER: quizsphere
      POSTGRES_PASSWORD: quizsphere
    ports:
      - "5432:5432"
    volumes:
      - quizsphere-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizsphere -d quizsphere"]
      interval: 5s
      retries: 10

volumes:
  quizsphere-pg:
